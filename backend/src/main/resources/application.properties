spring.application.name=verimetrix-backend
server.port=${PORT:8080}

# MySQL by default; every value can be overridden with an environment variable.
# To run without MySQL, start with SPRING_PROFILES_ACTIVE=h2 (see application-h2.properties).
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/verimetrix_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Origin patterns allowed to call the API directly, comma-separated ("[*]" = any port).
# Not needed with the Vite dev proxy (same origin). In production, list the site's real origin.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# AI engine (ai-engine/, Python): OCR + labelling rules. If it can't be reached, scans still
# finish but every rule comes back Review Required with the reason.
app.ai-url=${AI_ENGINE_URL:http://localhost:8000}
app.ai-timeout-seconds=${AI_TIMEOUT_SECONDS:180}
